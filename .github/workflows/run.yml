name: ETF 5m Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install yfinance pandas requests

      - name: 신호 체크 실행
        run: python test_1123.py

      - name: 상태 및 매수 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f last_buy.txt last_status.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update bot status" && git push)

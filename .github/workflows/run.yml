name: Stock Alert Bot

on:
  workflow_dispatch:
  schedule:
    # 평일은 외부 타이머 사용, 주말(토·일) 낮 12:00 KST만 GitHub 자체 실행
    - cron: "0 3 * * 6,0"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas requests

      - name: Restore & save daily alert cache
        uses: actions/cache@v4
        with:
          path: last_alert.txt
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py
